name: Phase 1 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: football_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football_app -d football_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend etl tests
      - name: Initialise test schema
        env:
          PGPASSWORD: test_password
        run: psql -h localhost -U football_app -d football_analytics -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: football_analytics
          DB_USER: football_app
          DB_PASSWORD: test_password
          REQUIRE_DB_TESTS: "1"
        run: pytest -q --strict-markers
